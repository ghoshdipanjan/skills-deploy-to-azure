name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      # Stage: Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Stage: Build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Stage: Test
      - name: Test
        run: npm test

      # Stage: Package / Archive Artifacts
      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  notify:
    runs-on: ubuntu-latest
    needs: build-test-package
    if: always()

    steps:
      - name: Pipeline succeeded
        if: needs.build-test-package.result == 'success'
        run: echo "Pipeline completed successfully!"

      - name: Pipeline failed
        if: needs.build-test-package.result != 'success'
        run: echo "Pipeline failed. Please check the logs."
